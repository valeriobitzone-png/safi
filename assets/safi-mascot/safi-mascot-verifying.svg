    <path class="sm-star-outline" d="M 60 74 L 62.53 80.52 L 69.51 80.91 L 64.09 85.33 L 65.88 92.09 L 60 88.3 L 54.12 92.09 L 55.91 85.33 L 50.49 80.91 L 57.47 80.52 Z" fill="#e8a93c" opacity="0.55"/>
