    <g class="sm-arm arm-sign"><path d="M 82 88 Q 90 44 97 38" fill="none" stroke="rgba(116,148,188,0.55)" stroke-width="4.4" stroke-linecap="round"/></g>

    
    <g class="sign sign-check">
