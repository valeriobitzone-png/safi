<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Safi</title>
  <!--
    Boot page of the widget window (bundled via frontendDist).

    The native shell navigates away to the loopback bridge as soon as
    the handshake (READY + ephemeral port + token) arrived. Until then
    this page shows the same Liquid Glass capsule as the widget: a
    breathing sparkle on frosted glass — never a white square.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
      color: #22352c;
      -webkit-font-smoothing: antialiased;
    }
    .capsule {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      background: rgba(252, 253, 254, 0.55);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      backdrop-filter: blur(22px) saturate(1.6);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 14px 34px rgba(20, 38, 28, 0.22),
        0 2px 6px rgba(20, 38, 28, 0.08);
    }
    .capsule::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 65%);
      pointer-events: none;
    }
    .capsule { position: relative; }
    .sparkle {
      color: #2f9e57;
      font-size: 0.85rem;
      animation: safi-breathe 1.8s ease-in-out infinite;
    }
    .label {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a9a91;
    }
    @keyframes safi-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.82); opacity: 0.72; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle { animation: none; }
    }
  </style>
</head>
<body>
  <main class="capsule" role="status">
    <span class="sparkle" aria-hidden="true">✦</span>
    <span class="label">Safi</span>
  </main>
</body>
</html>
