name: SAFI CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: safi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce UI color semantics
        run: npm run lint:ui-colors

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run conformance vectors
        run: node tests/run-conformance.mjs
