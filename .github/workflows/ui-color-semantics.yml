name: ui-color-semantics

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-color-semantics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-color-semantics:
    name: ui-color-semantics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce UI color semantics
        run: npm run lint:ui-colors
